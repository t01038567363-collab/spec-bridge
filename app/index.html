<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스펙 브릿지 (Spec Bridge) — 방산 규격 사전검사</title>
  <style>
    :root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mut:#64708a;--pri:#1d4ed8;--ok:#047857;--bad:#b91c1c;--chk:#b45309;--line:#dfe4ee}
    *{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{background:#0f1b3d;color:#fff;padding:14px 24px}header h1{margin:0;font-size:20px}header small{opacity:.75}
    .banner{background:#fff7e0;border-bottom:1px solid #f0d58a;padding:8px 24px;font-size:13px}
    main{max-width:1040px;margin:0 auto;padding:20px}
    .stepper{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .stepper button{flex:1;min-width:130px;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
    .stepper button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
    h2{margin:0 0 10px;font-size:17px}h3{margin:14px 0 6px;font-size:15px}
    button.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}
    button.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
    button.btn:disabled{opacity:.5;cursor:not-allowed}
    input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
    .drop{border:2px dashed #9db0d8;border-radius:10px;padding:28px;text-align:center;color:var(--mut);cursor:pointer}
    .drop.over{background:#eaf0ff}
    .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
    .충족,.MET{background:#d1fae5;color:var(--ok)}.미흡,.MISSING{background:#fee2e2;color:var(--bad)}.확인,.REVISION{background:#fef3c7;color:var(--chk)}
    .q{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}.q.err{border-color:var(--bad)}
    .err-t{color:var(--bad);font-size:12px}.mut{color:var(--mut);font-size:13px}
    .stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:110px;text-align:center;padding:12px;border-radius:8px;background:#f0f3fa}
    .stat b{display:block;font-size:24px}
    .item{border-left:4px solid var(--line);padding:8px 12px;margin:8px 0;background:#fafbfe}
    .item.s-충족,.item.s-MET{border-color:var(--ok)}.item.s-미흡,.item.s-MISSING{border-color:var(--bad)}.item.s-확인,.item.s-REVISION{border-color:var(--chk)}
    pre{white-space:pre-wrap;background:#f0f3fa;padding:10px;border-radius:6px;font-size:13px}
    #toast{position:fixed;right:16px;bottom:16px;background:#1c2433;color:#fff;padding:10px 14px;border-radius:8px;display:none;max-width:360px;font-size:13px}
    .hide{display:none}
  </style>
</head>
<body>
<header><h1>스펙 브릿지 (Spec Bridge)</h1><small>방산 규격 대응 준비도 사전검사 · 퀵오프 3조</small></header>
<div class="banner" id="banner"></div>
<main>
  <nav class="stepper" id="stepper"></nav>
  <div id="view"></div>
</main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
