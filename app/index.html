<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="방산 규격 대응 준비를 돕는 문서 기반 사전 점검 도구입니다." />
  <meta name="theme-color" content="#10213f" />
  <title>스펙 브릿지 — 방산 규격 사전검사</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --surface: #fff;
      --ink: #17233b;
      --muted: #62708a;
      --primary: #2459c5;
      --primary-dark: #19459f;
      --line: #dce3ef;
      --good: #087a55;
      --warn: #a45b08;
      --bad: #b42332;
      --shadow: 0 8px 24px rgba(23, 35, 59, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 3px solid #78a5ff; outline-offset: 2px; }
    .top {
      background: #10213f;
      color: #fff;
      padding: 18px max(20px, calc((100% - 1040px) / 2));
      box-shadow: 0 3px 14px rgba(16, 33, 63, .16);
    }
    .top h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    .top p { margin: 3px 0 0; color: #cbd6eb; font-size: 13px; }
    .banner {
      padding: 10px max(20px, calc((100% - 1040px) / 2));
      background: #fff6db;
      border-bottom: 1px solid #eed99a;
      color: #634b12;
      font-size: 13px;
    }
    main { width: min(100% - 32px, 1000px); margin: 24px auto 40px; min-height: 55vh; }
    .stepper { display: flex; gap: 9px; margin: 0 0 18px; }
    .stepper button {
      flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--surface); color: var(--muted);
      cursor: pointer; font-weight: 700; transition: background .15s, border-color .15s;
    }
    .stepper button:hover { border-color: #9bb4e8; }
    .stepper button.on { color: #fff; background: var(--primary); border-color: var(--primary); }
    .card {
      margin: 0 0 16px; padding: 22px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    h2 { margin: 0 0 10px; font-size: 19px; line-height: 1.35; }
    h3 { margin: 18px 0 8px; font-size: 16px; }
    p { margin: 8px 0; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .row > input, .row > select { max-width: 100%; }
    .mut { color: var(--muted); font-size: 13px; }
    .hide { display: none !important; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 40px;
      padding: 8px 15px; border: 1px solid var(--primary); border-radius: 8px;
      background: var(--primary); color: #fff; cursor: pointer; font-weight: 700;
    }
    .btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn.sec { background: #fff; color: var(--primary); }
    .btn.sec:hover { background: #f1f5ff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    input, select, textarea {
      max-width: 100%; padding: 9px 10px; border: 1px solid #cbd5e3; border-radius: 8px;
      background: #fff; color: var(--ink);
    }
    input[type="radio"], input[type="checkbox"] { accent-color: var(--primary); }
    textarea { width: 100%; resize: vertical; }
    label { line-height: 1.5; }
    .drop {
      padding: 26px 18px; border: 2px dashed #9bb0d5; border-radius: 12px;
      background: #f9fbff; color: var(--muted); text-align: center; cursor: pointer;
    }
    .drop:hover, .drop.over { border-color: var(--primary); background: #eef4ff; }
    .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .충족, .MET { color: var(--good); background: #d9f5e9; }
    .미흡, .MISSING { color: var(--bad); background: #fde4e6; }
    .확인, .REVISION { color: var(--warn); background: #fff0cf; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
    .stat { flex: 1; min-width: 110px; padding: 13px; border-radius: 10px; background: #f1f4fa; text-align: center; }
    .stat b { display: block; font-size: 24px; line-height: 1.3; }
    .item { margin: 10px 0; padding: 12px 14px; border-left: 4px solid var(--line); border-radius: 6px; background: #f8faff; }
    .item.s-충족, .item.s-MET { border-color: var(--good); }
    .item.s-미흡, .item.s-MISSING { border-color: var(--bad); }
    .item.s-확인, .item.s-REVISION { border-color: var(--warn); }
    .q { margin: 10px 0; padding: 13px; border: 1px solid var(--line); border-radius: 10px; }
    .q.err { border-color: var(--bad); background: #fffafa; }
    .err-t { color: var(--bad); font-size: 12px; }
    pre { overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; border-radius: 9px; background: #f1f4fa; font: 13px/1.6 ui-monospace, monospace; }
    #toast {
      position: fixed; z-index: 10; right: 18px; bottom: 18px; max-width: min(420px, calc(100vw - 36px));
      padding: 12px 16px; border-radius: 10px; background: #17233b; color: white;
      box-shadow: var(--shadow); font-size: 14px;
    }
    footer { padding: 18px; color: var(--muted); text-align: center; font-size: 12px; }
    @media (max-width: 640px) {
      .top { padding: 15px 16px; }
      .banner { padding: 9px 16px; }
      main { width: min(100% - 24px, 1000px); margin: 16px auto 28px; }
      .stepper { gap: 6px; }
      .stepper button { padding: 9px 5px; font-size: 12px; }
      .card { padding: 16px; border-radius: 11px; }
      .row > .btn { flex: 1 1 auto; }
      .q .row { align-items: stretch; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="top">
    <h1>스펙 브릿지 <span lang="en">Spec Bridge</span></h1>
    <p>방산 규격 대응 준비도 사전검사 · 퀵오프 3조</p>
  </header>
  <div class="banner" id="banner" role="status" aria-live="polite">
    이 서비스는 공식 인증·심사가 아닌 사전 점검 보조 도구입니다. 가상 자료를 사용해 주세요.
  </div>
  <main>
    <nav class="stepper" id="stepper" aria-label="검사 단계"></nav>
    <div id="view" aria-live="polite"></div>
    <noscript><section class="card"><h2>JavaScript를 사용할 수 없습니다</h2><p>스펙 브릿지를 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</p></section></noscript>
  </main>
  <footer>스펙 브릿지 · 방산 규격 사전 점검 보조 도구</footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="vendor/pdf.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
